services:
  postgres:
    image: postgres:16-alpine
    container_name: whatisup-db
    environment:
      POSTGRES_USER: whatisup
      POSTGRES_PASSWORD: whatisup
      POSTGRES_DB: whatisup
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whatisup"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
